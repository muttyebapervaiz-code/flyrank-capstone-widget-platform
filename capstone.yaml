run: "cd app_folder && venv\\Scripts\\activate && uvicorn app.main:app --reload"
seed: "Sign up via POST /auth/signup, then create a widget via POST /widgets using the returned token"
test: "Manual testing via http://127.0.0.1:8000/docs (see EVIDENCE.md for full test log)"
base_url: "http://127.0.0.1:8000"
endpoints:
  - POST /auth/signup
  - POST /auth/login
  - POST /widgets
  - GET /widgets
  - GET /widgets/{id}
  - PUT /widgets/{id}
  - DELETE /widgets/{id}
  - GET /widgets/{id}/config
  - GET /widgets/{id}/embed
  - GET /widget.js
  - POST /submissions
  - GET /widgets/{id}/submissions
  - GET /widgets/{id}/stats